name: Generate temporary Maidan backend lockfile

on:
  push:
    branches:
      - ops/maidan-backend-lock-generator
    paths:
      - '.maidan-lock/package.json'
      - '.github/workflows/maidan-backend-lock-generator.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.maidan-lock/package.json'
      - '.github/workflows/maidan-backend-lock-generator.yml'

permissions:
  contents: write

concurrency:
  group: maidan-backend-lock-generator
  cancel-in-progress: false

jobs:
  generate:
    if: (github.event_name == 'push' && github.actor == 'waseem99') || (github.event_name == 'pull_request' && github.actor == 'waseem99' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/maidan-backend-lock-generator
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Generate npm lockfile
        working-directory: .maidan-lock
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts

      - name: Validate clean locked install
        working-directory: .maidan-lock
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          rm -rf node_modules
          npm ci --legacy-peer-deps
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3) process.exit(1); console.log(Object.keys(p.packages||{}).length)"

      - name: Commit lockfile and validation marker
        shell: bash
        run: |
          set -euo pipefail
          printf 'Node 20 npm ci validated at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .maidan-lock/npm-ci-validated.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .maidan-lock/package-lock.json .maidan-lock/npm-ci-validated.txt
          if git diff --cached --quiet; then
            echo 'Lockfile already current and validated'
            exit 0
          fi
          git commit -m 'test: validate Maidan backend package lock'
          git push origin HEAD:ops/maidan-backend-lock-generator
